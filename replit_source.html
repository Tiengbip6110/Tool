import { createHotContext } from "/@vite/client";
const hot = createHotContext("/__dummy__runtime-error-plugin");

function sendError(error) {
  if (!(error instanceof Error)) {
    error = new Error("(unknown runtime error)");
  }
  const serialized = {
    message: error.message,
    stack: error.stack,
  };
  hot.send("runtime-error-plugin:error", serialized);
}

window.addEventListener("error", (evt) => {
  sendError(evt.error);
});

window.addEventListener("unhandledrejection", (evt) => {
  sendError(evt.reason);
});
</script>

  <script type="text/javascript" src="/@replit/vite-plugin-dev-banner/banner-script.js" id="replit-dev-banner"></script>
</head>
<body class="preload">
    <div class="bubbles" id="bubbles"></div>
    <div class="bg-hearts" id="bgHearts"></div>

    <div class="container" id="mainContainer">
        <!-- Calculator screen -->
        <div class="calculator-screen" id="calculatorScreen">
            <div class="input-avatar-row">
                <div class="avatar-square">
                    <img id="avatarImg" src="img/new_1.jpg" alt="Avatar" style="display:block;">
                </div>
                <div class="input-and-keypad">
                    <div class="calculator-title">Nhập ngày sinh của bạn</div>
                    <input type="password" class="display" id="display" placeholder="••••••••" maxlength="8">
                    <div class="buttons">
                        <button class="btn btn-number" onclick="appendToDisplay('1')">1</button>
                        <button class="btn btn-number" onclick="appendToDisplay('2')">2</button>
                        <button class="btn btn-number" onclick="appendToDisplay('3')">3</button>
                        <button class="btn btn-number" onclick="appendToDisplay('4')">4</button>
                        <button class="btn btn-number" onclick="appendToDisplay('5')">5</button>
                        <button class="btn btn-number" onclick="appendToDisplay('6')">6</button>
                        <button class="btn btn-number" onclick="appendToDisplay('7')">7</button>
                        <button class="btn btn-number" onclick="appendToDisplay('8')">8</button>
                        <button class="btn btn-number" onclick="appendToDisplay('9')">9</button>
                        <button class="btn btn-clear" onclick="clearDisplay()">C</button>
                        <button class="btn btn-number" onclick="appendToDisplay('0')">0</button>
                        <button class="btn btn-enter" onclick="checkPassword()">✓</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Birthday screen -->
    <div class="birthday-screen" id="birthdayScreen" style="display:none;">
        <div class="wishes-page" id="wishesPage">
            <div class="main-title">
                <h1 class="rainbow-text">💗CHÚC MỪNG SINH NHẬT💗</h1>
                <div class="subtitle">Trương Lê Thảo Nguyên</div>
            </div>

            <div class="birthday-card-section">
                <div class="card-3d">
                    <div class="card-imgBox">
                        <div class="card-bark"></div>
                        <img src="img/new_2.jpg" alt="Birthday">
                    </div>
                    <div class="card-details">
                        <h4>HAPPY BIRTHDAY</h4>
                        <p>Chúc bạn có một ngày snzz,</p>
                        <p>Tuổi mới học giỏi,xinh gái hơn</p>
                        <p>Sớm có người yêu..</p>
                        <p>Chúc bạn có được tất cả.</p>
                        <p>Chúc bạn luôn vui vẻ, hạnh phúc.</p>
                        <p>Chúc bạn luôn xinh đẹp, đáng yêu.</p>
                        <p>Send to Rùa Nguyên 💖</p>
                    </div>
                </div>
            </div>

            <div style="text-align: center;">
                <button class="continue-btn" onclick="showLetter()">
                    Mở quà nè
                </button>
            </div>
        </div>
    </div>

    <div id="chucmungScreen">
        <div class="fireworks" id="fireworks"></div>
        <div class="heart-images-container" id="heartImagesContainer"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.remove('preload');
        });

        const display = document.getElementById('display');
        const calculatorScreen = document.getElementById('calculatorScreen');
        const birthdayScreen = document.getElementById('birthdayScreen');
        const mainContainer = document.getElementById('mainContainer');

        function appendToDisplay(value) {
            if (display.value.length < 8) {
                display.value += value;
            }
        }

        function clearDisplay() {
            display.value = '';
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        function checkPassword() {
            if (display.value === '03032010') {
                calculatorScreen.style.display = 'none';
                mainContainer.style.display = 'none';
                birthdayScreen.style.display = 'block';

                document.body.style.overflow = 'hidden';
                document.body.style.position = 'fixed';
                document.body.style.width = '100vw';
                document.body.style.height = '100vh';
                document.documentElement.style.overflow = 'hidden';

                const card3D = document.querySelector('.card-3d');
                if (card3D) {
                    card3D.addEventListener('click', function() {
                        this.classList.toggle('active');
                    });
                    card3D.addEventListener('touchstart', function(e) {
                        e.preventDefault();
                        this.classList.toggle('active');
                    });
                }
            } else {
                display.style.animation = 'shake 0.6s ease-in-out';
                display.style.borderColor = '#ff4444';

                setTimeout(() => {
                    alert('🌸 Mật khẩu không đúng! Hãy thử lại nhé! 🌸');
                    clearDisplay();
                    display.style.animation = '';
                    display.style.borderColor = '';
                }, 600);
            }
        }

        function showLetter() {
            document.getElementById('wishesPage').style.transition = 'opacity 0.8s ease';
            document.getElementById('wishesPage').style.opacity = '0';

            setTimeout(() => {
                birthdayScreen.style.display = 'none';
                document.getElementById('chucmungScreen').style.display = 'block';
                document.body.classList.add('chucmung-mode');

                startContinuousFireworks();
                startScrollingHeartImages();
                startRectangleImages();
            }, 800);
        }

        document.addEventListener('keydown', function(event) {
            if (calculatorScreen.style.display === 'none') return;

            const key = event.key;
            if (key >= '0' && key <= '9') {
                event.preventDefault();
                appendToDisplay(key);
            } else if (key === 'Enter') {
                event.preventDefault();
                checkPassword();
            } else if (key === 'Escape') {
                event.preventDefault();
                clearDisplay();
            } else if (key === 'Backspace') {
                event.preventDefault();
                deleteLast();
            }
        });

        function createBubble() {
            const bubbles = document.getElementById('bubbles');
            if (!bubbles) return;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const size = Math.random() * 40 + 30;
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            bubble.style.left = Math.random() * 100 + 'vw';
            bubble.style.animationDuration = (6 + Math.random() * 4) + 's';
            bubbles.appendChild(bubble);
            setTimeout(() => { bubble.remove(); }, 9000);
        }
        setInterval(createBubble, 700);
        for (let i = 0; i < 10; i++) createBubble();

        function createBgHeart() {
            const bgHearts = document.getElementById('bgHearts');
            if (!bgHearts) return;
            const heart = document.createElement('div');
            heart.className = 'bg-heart';
            const heartTypes = ['💖', '💗', '💞'];
            heart.innerHTML = heartTypes[Math.floor(Math.random() * heartTypes.length)];
            const size = Math.random() * 18 + 22;
            heart.style.fontSize = size + 'px';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (5 + Math.random() * 4) + 's';
            bgHearts.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 9000);
        }
        setInterval(createBgHeart, 1200);
        for (let i = 0; i < 6; i++) createBgHeart();

        // Hình ảnh mới
        const heartImages = [
            "img/new_1.jpg", "img/new_2.jpg", "img/new_3.jpg",
            "img/new_4.jpg", "img/new_5.jpg", "img/new_6.jpg",
            "img/new_7.jpg", "img/new_8.jpg", "img/new_9.jpg",
            "img/new_10.jpg", "img/new_11.jpg", "img/new_12.jpg"
        ];

        function createFireworks() {
            const fireworks = document.getElementById('fireworks');
            if (!fireworks) return;
            fireworks.style.display = 'block';
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3', '#54a0ff'];

            for (let i = 0; i < 13; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.left = Math.random() * 100 + '%';
                    firework.style.top = Math.random() * 100 + '%';
                    firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    firework.style.animationDelay = Math.random() * 2 + 's';
                    firework.style.boxShadow = `0 0 20px ${firework.style.backgroundColor}`;
                    fireworks.appendChild(firework);

                    setTimeout(() => { firework.remove(); }, 2000);
                }, i * 350);
            }
        }

        function createRectangleImage() {
            const container = document.getElementById('heartImagesContainer');
            if (!container) return;
            const img = document.createElement('img');
            const randomImage = heartImages[Math.floor(Math.random() * heartImages.length)];
            img.src = randomImage;
            img.className = 'heart-img-scroll';

            const randomY = Math.random() * 95;
            img.style.top = randomY + 'vh';

            const duration = 5 + Math.random() * 3;
            img.style.animationDuration = duration + 's';

            const shadowColors = [
                'rgba(255, 255, 255, 0.4)', 'rgba(255, 255, 255, 0.5)',
                'rgba(255, 255, 255, 0.6)', 'rgba(255, 255, 255, 0.3)', 'rgba(240, 240, 240, 0.5)'
            ];
            const randomShadow = shadowColors[Math.floor(Math.random() * shadowColors.length)];
            img.style.boxShadow = `0 10px 30px ${randomShadow}`;

            const widths = [177, 170, 220, 188, 210, 240, 225,193];
            const heights = [300,310, 150, 290, 210, 180, 380,330];
            const sizeIndex = Math.floor(Math.random() * widths.length);
            img.style.width = widths[sizeIndex] + 'px';
            img.style.height = heights[sizeIndex] + 'px';

            img.style.imageRendering = 'high-quality';

            container.appendChild(img);

            setTimeout(() => {
                if (img.parentNode) { img.remove(); }
            }, duration * 1000);
        }

        function createScrollingHeartImage() {
            const container = document.getElementById('heartImagesContainer');
            if (!container) return;
            const img = document.createElement('img');
            const randomImage = heartImages[Math.floor(Math.random() * heartImages.length)];
            img.src = randomImage;
            img.className = 'heart-img-scroll';

            const randomY = Math.random() * 95;
            img.style.top = randomY + 'vh';

            const duration = 6 + Math.random() * 3;
            img.style.animationDuration = duration + 's';

            const shadowColors = [
                'rgba(255, 255, 255, 0.4)', 'rgba(255, 255, 255, 0.5)',
                'rgba(255, 255, 255, 0.6)', 'rgba(255, 255, 255, 0.3)', 'rgba(240, 240, 240, 0.5)'
            ];
            const randomShadow = shadowColors[Math.floor(Math.random() * shadowColors.length)];
            img.style.boxShadow = `0 9px 25px ${randomShadow}`;

            const sizes = [210, 240, 220, 230, 250, 210, 215, 235];
            const randomSize = sizes[Math.floor(Math.random() * sizes.length)];
            img.style.width = randomSize + 'px';
            img.style.height = randomSize + 'px';

            img.style.imageRendering = 'high-quality';

            container.appendChild(img);

            setTimeout(() => {
                if (img.parentNode) { img.remove(); }
            }, duration * 1000);
        }

        function startRectangleImages() {
            for (let i = 0; i < 13; i++) {
                setTimeout(() => { createRectangleImage(); }, i * 240);
            }
            setInterval(createRectangleImage, 550);
        }

        function startScrollingHeartImages() {
            for (let i = 0; i < 12; i++) {
                setTimeout(() => { createScrollingHeartImage(); }, i * 2570);
            }
            setInterval(createScrollingHeartImage, 300);
        }

        function startContinuousFireworks() {
            createFireworks();
            setInterval(createFireworks, 5000);
        }
    </script>
<script src="https://replit-cdn.com/replit-pill/replit-pill.global.js" data-repl-id="a9950b47-3af0-4f86-bd82-2aecce52e09c"></script></body>
