services:
  - type: worker
    name: txmd5-predictor
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    rootDir: txmd5_predictor
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        value: "8308036418"
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
