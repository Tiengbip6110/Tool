<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy International Women's Day</title>
  <link rel="icon" type="image/png" href="https://i.postimg.cc/qvjz8QFW/Logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
/* --- MAIN CSS --- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family:
    "Outfit",
    "Inter",
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    sans-serif;
  background: linear-gradient(135deg, #ffd1dc 0%, #ffafbd 50%, #ffc3a0 100%);
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
  overflow-x: hidden;
  overflow-y: auto;
}

@keyframes gradientBG {
  0% {
    background-position: 0% 50%;
  }

  50% {
    background-position: 100% 50%;
  }

  100% {
    background-position: 0% 50%;
  }
}

.container {
  width: 90%;
  max-width: 800px;
  z-index: 10;
  position: relative;
}

h1 {
  color: #d81b60;
  font-size: 2.5rem;
  margin-bottom: 1rem;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.05);
}

p {
  color: #ad1457;
  font-size: 1.1rem;
  line-height: 1.6;
  margin-bottom: 2rem;
}

.menu {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 2.5rem;
  perspective: 1000px;
}

@media (max-width: 600px) {
  .menu {
    grid-template-columns: 1fr;
    gap: 1rem;
    padding-top: 2rem;
    padding-bottom: 2rem;
  }

  .menu-item {
    padding: 1rem 1rem;
    font-size: 1rem;
    border-radius: 1.5rem;
    animation: none !important;
    transform: none !important;
  }

  .menu-item .icon img {
    width: 40px;
    height: 40px;
  }
}

.menu-item {
  background: rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border: 2px solid rgba(255, 255, 255, 0.5);
  border-radius: 2rem;
  padding: 2.5rem 1.5rem;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  color: #d81b60;
  font-weight: 700;
  font-size: 1.2rem;
  box-shadow: 0 8px 32px 0 rgba(255, 105, 180, 0.15);
  animation: float 6s ease-in-out infinite;
}

.menu-item:nth-child(even) {
  animation-delay: -3s;
}

.menu-item:hover {
  transform: scale(1.1) translateY(-5px);
  background: #fff;
  box-shadow: 0 10px 20px rgba(255, 105, 180, 0.3);
}

.menu-item .icon {
  font-size: 3.5rem;
  filter: drop-shadow(0 5px 10px rgba(255, 105, 180, 0.3));
  display: flex;
  align-items: center;
  justify-content: center;
}

.menu-item .icon img {
  width: 80px;
  height: 80px;
  object-fit: contain;
}

.menu-item:active {
  transform: scale(0.9) translateY(5px);
  box-shadow: 0 2px 10px 0 rgba(255, 105, 180, 0.2);
  background: rgba(255, 255, 255, 0.5);
  transition: all 0.1s ease;
}

@keyframes float {

  0%,
  100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-20px);
  }
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image:
    linear-gradient(45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%),
    linear-gradient(-45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.1) 75%),
    linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.1) 75%);
  background-size: 60px 60px;
  background-position: 0 0, 0 30px, 30px -30px, -30px 0px;
  pointer-events: none;
  z-index: 1;
}

.heart {
  position: fixed;
  bottom: -50px;
  color: #ff69b4;
  font-size: 20px;
  user-select: none;
  pointer-events: none;
  z-index: -1;
  animation: flyUp linear forwards;
}

@keyframes flyUp {
  0% {
    transform: translateY(0) rotate(0deg);
    opacity: 1;
  }

  100% {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}

.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

.overlay.active {
  opacity: 1;
  visibility: visible;
}

.letter-modal {
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  width: 90%;
  max-width: 500px;
  height: 650px;
  padding: 40px;
  position: relative;
  border-radius: 30px;
  border: 1px solid rgba(255, 255, 255, 0.4);
  box-shadow:
    0 25px 50px -12px rgba(216, 27, 96, 0.2),
    0 0 0 8px rgba(255, 255, 255, 0.4);
  transform: translateY(50px) scale(0.9);
  transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.letter-modal::after {
  content: "";
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;
  bottom: 15px;
  border: 1px dashed rgba(216, 27, 96, 0.3);
  border-radius: 20px;
  pointer-events: none;
}

.overlay.active .letter-modal {
  transform: translateY(0) scale(1);
}

.close-btn {
  position: absolute;
  top: 15px;
  right: 15px;
  width: 40px;
  height: 40px;
  background: rgba(216, 27, 96, 0.8);
  color: white;
  border: none;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  transition: all 0.3s ease;
  backdrop-filter: blur(5px);
}

.close-btn:hover {
  background: #d81b60;
  transform: rotate(90deg) scale(1.1);
}

.letter-content {
  color: #444;
  display: flex;
  flex-direction: column;
  height: 100%;
  position: relative;
  z-index: 2;
}

.letter-body {
  font-family: "Dancing Script", cursive;
  font-size: 1.6rem;
  line-height: 2;
  color: #5d4037;
  overflow-y: auto;
  flex-grow: 1;
  padding: 10px 15px 10px 0;
  -ms-overflow-style: none;
  /* IE and Edge */
  scrollbar-width: none;
  /* Firefox */
}

.letter-body::-webkit-scrollbar {
  display: none;
  /* Chrome, Safari and Opera */
}

.letter-body p {
  margin-bottom: 25px;
  color: inherit;
  font-size: inherit;
  line-height: inherit;
}

.letter-gif {
  position: absolute;
  bottom: 20px;
  right: 20px;
  width: 120px;
  height: auto;
  pointer-events: none;
  z-index: 1;
  opacity: 0.6;
  filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.1));
}

.letter-footer {
  text-align: right;
  margin-top: 30px;
  font-size: 1.8rem !important;
  font-weight: bold;
  color: #d81b60 !important;
}

@media (max-width: 480px) {
  .letter-modal {
    padding: 30px 20px;
  }

  .letter-body {
    font-size: 1.2rem;
  }
}

.music-modal {
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  width: 90%;
  max-width: 450px;
  height: 650px;
  padding: 30px;
  border-radius: 30px;
  border: 1px solid rgba(255, 255, 255, 0.4);
  box-shadow:
    0 25px 50px -12px rgba(216, 27, 96, 0.2),
    0 0 0 8px rgba(255, 255, 255, 0.4);
  position: relative;
  color: #d81b60;
  transform: translateY(50px) scale(0.9);
  transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  display: flex;
  flex-direction: column;
}

.overlay.active .music-modal {
  transform: translateY(0) scale(1);
}

.spotify-player {
  display: flex;
  flex-direction: column;
  gap: 20px;
  flex-grow: 1;
  overflow: hidden;
}

.player-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  font-size: 1rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  font-weight: 800;
  color: #ad1457;
  opacity: 0.8;
}

.spotify-logo {
  width: 28px;
  height: 28px;
  filter: drop-shadow(0 4px 6px rgba(216, 27, 96, 0.3));
}

.now-playing {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding-bottom: 10px;
}

.song-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  width: 100%;
}

.album-art {
  width: 200px;
  height: 200px;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 15px 35px rgba(216, 27, 96, 0.25);
  background: linear-gradient(135deg, #ffd1dc, #ff8aab);
  position: relative;
  transition: transform 0.5s ease;
}

.album-art:hover {
  transform: scale(1.05) rotate(2deg);
}

.album-art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.song-details {
  margin-top: 5px;
}

.song-details h3 {
  margin: 0;
  font-size: 1.4rem;
  color: #d81b60;
  font-weight: 800;
}

.song-details p {
  margin: 4px 0 0;
  font-size: 1rem;
  color: #ad1457;
  opacity: 0.7;
}

.player-controls {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.progress-container {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 0.85rem;
  color: #ad1457;
  font-weight: 600;
}

.progress-bar {
  flex-grow: 1;
  height: 8px;
  background: rgba(216, 27, 96, 0.1);
  border-radius: 10px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.progress {
  height: 100%;
  background: linear-gradient(90deg, #ff8aab, #d81b60);
  border-radius: 10px;
  width: 0%;
  position: relative;
  transition: width 0.1s linear;
}

.control-buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 25px;
}

.ctrl-btn {
  background: none;
  border: none;
  color: #ff8aab;
  font-size: 1.8rem;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}

.ctrl-btn:hover {
  color: #d81b60;
  transform: scale(1.2);
}

.ctrl-btn.play-pause {
  width: 65px;
  height: 65px;
  background: linear-gradient(135deg, #d81b60, #ad1457);
  color: white;
  border-radius: 50%;
  font-size: 1.4rem;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 20px rgba(216, 27, 96, 0.4);
}

.ctrl-btn.play-pause:hover {
  transform: scale(1.1) translateY(-2px);
  box-shadow: 0 12px 25px rgba(216, 27, 96, 0.5);
}

.song-list {
  margin-top: 10px;
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-right: 8px;
  scrollbar-width: thin;
  scrollbar-color: rgba(216, 27, 96, 0.2) transparent;
}

.song-list::-webkit-scrollbar {
  width: 4px;
}

.song-list::-webkit-scrollbar-thumb {
  background: rgba(216, 27, 96, 0.2);
  border-radius: 10px;
}

.song-item {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 12px;
  border-radius: 16px;
  cursor: pointer;
  transition: all 0.3s ease;
  background: rgba(255, 255, 255, 0.3);
  border: 1px solid transparent;
}

.song-item:hover {
  background: rgba(255, 255, 255, 0.6);
  transform: translateX(5px);
  border-color: rgba(216, 27, 96, 0.1);
}

.song-item.active {
  background: rgba(216, 27, 96, 0.1);
  border-color: rgba(216, 27, 96, 0.2);
}

.song-item img {
  width: 50px;
  height: 50px;
  border-radius: 12px;
  object-fit: cover;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
}

.song-item-info {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
}

.song-item-title {
  font-size: 1rem;
  font-weight: 700;
  color: #d81b60;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.song-item-artist {
  font-size: 0.85rem;
  color: #ad1457;
  opacity: 0.7;
}

.image-modal {
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  width: 90%;
  max-width: 600px;
  height: 650px;
  padding: 40px 20px;
  position: relative;
  border-radius: 30px;
  border: 1px solid rgba(255, 255, 255, 0.4);
  box-shadow:
    0 25px 50px -12px rgba(216, 27, 96, 0.2),
    0 0 0 8px rgba(255, 255, 255, 0.4);
  transform: translateY(50px) scale(0.9);
  transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.overlay.active .image-modal {
  transform: translateY(0) scale(1);
}

.gallery-container {
  display: flex;
  flex-direction: column;
  gap: 30px;
  width: 100%;
  overflow: hidden;
  cursor: grab;
}

.gallery-container:active {
  cursor: grabbing;
}

.gallery-row {
  display: flex;
  width: max-content;
  pointer-events: auto;
}

.gallery-row img {
  height: 200px;
  width: 150px;
  object-fit: cover;
  border-radius: 16px;
  box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
  border: 4px solid white;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  cursor: pointer;
  margin-right: 20px;
}

.gallery-row img:hover {
  transform: scale(1.1) translateY(-10px) rotate(2deg);
  box-shadow: 0 15px 30px rgba(216, 27, 96, 0.2);
  z-index: 10;
}

.row-top {
  animation: scroll-left 30s linear infinite;
}

.row-bottom {
  animation: scroll-right 30s linear infinite;
}

@keyframes scroll-left {
  0% {
    transform: translateX(0);
  }

  100% {
    transform: translateX(-50%);
  }
}

@keyframes scroll-right {
  0% {
    transform: translateX(-50%);
  }

  100% {
    transform: translateX(0);
  }
}

.lightbox-content {
  position: relative;
  max-width: 90%;
  max-height: 90%;
  display: flex;
  align-items: center;
  justify-content: center;
}

#lightbox-img {
  max-width: 100%;
  max-height: 85vh;
  border-radius: 8px;
  box-shadow: 0 5px 30px rgba(0, 0, 0, 0.5);
  border: 5px solid white;
}

@media (max-width: 480px) {
  .image-modal {
    height: 500px;
  }

  .gallery-row img {
    height: 140px;
    width: 110px;
  }

  .gallery-gif-wrapper.top {
    top: 5px;
    left: 5px;
  }

  .gallery-gif-wrapper.bottom {
    bottom: 5px;
    right: 5px;
  }

  .gallery-gif {
    width: 40px !important;
  }

  .gallery-gif-wrapper.bottom .gallery-gif {
    width: 100px !important;
  }

  .gallery-gif-wrapper.top .gallery-gif {
    width: 100px !important;
  }

  .flying-text {
    font-size: 0.8rem !important;
  }
}

.gallery-gif-wrapper {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 15px;
  pointer-events: none;
  z-index: 10;
  max-width: calc(100% - 20px);
  overflow: hidden;
}

.gallery-gif-wrapper.top {
  top: 10px;
  left: 10px;
  flex-direction: row;
}

.gallery-gif-wrapper.bottom {
  bottom: 10px;
  right: 10px;
  flex-direction: row;
}

.gallery-gif {
  width: 80px;
  height: auto;
  opacity: 0.9;
  z-index: 11;
}

.gallery-gif-wrapper.bottom .gallery-gif {
  width: 100px;
}

.flying-text {
  font-size: 1.2rem;
  font-weight: bold;
  color: #ff1493;
  text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
  white-space: nowrap;
}

.text-right {
  animation: run-right 8s linear infinite;
}

.text-left {
  animation: run-left 8s linear infinite;
}

@keyframes run-right {
  0% {
    transform: translateX(-100%);
    opacity: 0;
  }

  10% {
    opacity: 1;
  }

  90% {
    opacity: 1;
  }

  100% {
    transform: translateX(100%);
    opacity: 0;
  }
}

@keyframes run-left {
  0% {
    transform: translateX(100%);
    opacity: 0;
  }

  10% {
    opacity: 1;
  }

  90% {
    opacity: 1;
  }

  100% {
    transform: translateX(-100%);
    opacity: 0;
  }
}

.gift-modal {
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  width: 95%;
  max-width: 900px;
  height: 85vh;

.overlay.active .gift-modal {

}

.gift-iframe {

}

.gift-modal .close-btn {

}

.gift-modal .fullscreen-btn {

  font-size: 18px;

.gift-modal .fullscreen-btn:hover {

/* Lock Screen Styles */
.lock-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #ffd1dc 0%, #ffafbd 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5000;
  transition: transform 0.8s cubic-bezier(0.8, 0, 0.2, 1), opacity 0.5s ease;
}

.lock-screen::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image:
    linear-gradient(45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%),
    linear-gradient(-45deg, rgba(255, 255, 255, 0.1) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.1) 75%),
    linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.1) 75%);
  background-size: 60px 60px;
  background-position: 0 0, 0 30px, 30px -30px, -30px 0px;
  pointer-events: none;
}

.lock-screen.unlocked {
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
}

.lock-content {
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  padding: 50px;
  border-radius: 50px;
  text-align: center;
  box-shadow:
    0 30px 60px rgba(216, 27, 96, 0.2),
    0 0 0 10px rgba(255, 255, 255, 0.1);
  width: 90%;
  max-width: 850px;
  animation: fadeIn 1s ease;
  display: flex;
  align-items: center;
  gap: 50px;
  position: relative;
  z-index: 10;
}

.lock-image {
  flex: 1;
  max-width: 350px;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  cursor: none;
}

.lock-image img {
  width: 100%;
  height: auto;
  border-radius: 20px;
  box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
  border: 5px solid white;
}

.lock-form {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.lock-icon {
  font-size: 3rem;
  color: #d81b60;
  margin-bottom: 20px;
  animation: heartbeat 1.5s ease infinite;
}

@keyframes heartbeat {
  0% {
    transform: scale(1);
  }

  15% {
    transform: scale(1.15);
  }

  30% {
    transform: scale(1);
  }

  45% {
    transform: scale(1.15);
  }

  60% {
    transform: scale(1);
  }
}



.pass-dots {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-bottom: 40px;
}

.dot {
  width: 16px;
  height: 16px;
  border: 2px solid #d81b60;
  border-radius: 50%;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.dot.active {
  background: #d81b60;
  transform: scale(1.2);
  box-shadow: 0 0 10px rgba(216, 27, 96, 0.5);
}

.numpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.num-btn {
  width: 75px;
  height: 75px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.3);
  background: rgba(255, 255, 255, 0.1);
  color: #d81b60;
  font-size: 1.6rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(5px);
}

.num-btn:hover {
  background: rgba(255, 255, 255, 0.4);
  transform: scale(1.1);
  border-color: rgba(255, 255, 255, 0.6);
  box-shadow: 0 10px 20px rgba(216, 27, 96, 0.1);
}

.num-btn:active {
  transform: scale(0.9);
  background: #d81b60;
  color: white;
}

.num-btn.blank {
  visibility: hidden;
}

.num-btn.delete-btn {
  font-size: 1.4rem;
  border: none;
  background: transparent;
}

.num-btn.delete-btn:hover {
  background: rgba(255, 255, 255, 0.2);
}

/* Shake Animation */
.shake {
  animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
}

@keyframes shake {

  10%,
  90% {
    transform: translate3d(-1px, 0, 0);
  }

  20%,
  80% {
    transform: translate3d(2px, 0, 0);
  }

  30%,
  50%,
  70% {
    transform: translate3d(-4px, 0, 0);
  }

  40%,
  60% {
    transform: translate3d(4px, 0, 0);
  }
}

.main-content-hidden {
  filter: blur(20px);
  opacity: 0.3;
  transition: all 1s ease;
}

.main-content-visible {
  filter: blur(0);
  opacity: 1;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 768px) {
  .lock-content {
    flex-direction: column;
    padding: 20px 15px;
    max-width: 320px;
    /* Nhỏ hơn cho điện thoại */
    gap: 15px;
    border-radius: 30px;
  }

  .lock-image {
    max-width: 140px;
    /* Ảnh nhỏ hơn */
  }

  .lock-image img {
    border-width: 3px;
  }

  .lock-icon {
    font-size: 2rem;
    margin-bottom: 10px;
  }

  .pass-dots {
    margin-bottom: 25px;
    gap: 10px;
  }

  .dot {
    width: 12px;
    height: 12px;
  }

  .num-btn {
    width: 55px;
    /* Nút bấm nhỏ lại */
    height: 55px;
    font-size: 1.2rem;
  }

  .numpad {
    gap: 12px;
  }

  .reset-lock-btn {
    bottom: 15px;
    right: 15px;
    width: 45px;
    height: 45px;
  }
}

.reset-lock-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: rgba(255, 255, 255, 0.3);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.5);
  width: 50px;
  height: 50px;
  border-radius: 50%;
  color: #d81b60;
  font-size: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 15px rgba(216, 27, 96, 0.2);
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  z-index: 100;
  display: none;
  /* Ẩn mặc định */
}

/* Hiển thị nút khi đã mở khóa */
.main-content-visible~.reset-lock-btn {
  display: flex;
}

.reset-lock-btn:hover {
  transform: scale(1.1) rotate(10deg);
  background: white;
  box-shadow: 0 8px 25px rgba(216, 27, 96, 0.3);
}

.reset-lock-btn:active {
  transform: scale(0.9);
}

@media (max-width: 768px) {
  .reset-lock-btn {
    bottom: 15px;
    right: 15px;
    width: 45px;
    height: 45px;
  }
}


/* --- GIFT CSS --- */
*,
*::after,
*::before {
  padding: 0;
  margin: 0;
  box-sizing: border-box;
}

:root {
  --dark-color: #000;
}

body {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  min-height: 100vh;
  background-color: var(--dark-color);
  overflow: hidden;
  perspective: 1000px;
}

.gift-main-content .night {
  position: fixed;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  width: 100%;
  height: 100%;
  filter: blur(0.1vmin);
  background-image:
    radial-gradient(ellipse at top, transparent 0%, var(--dark-color)),
    radial-gradient(ellipse at bottom,
      var(--dark-color),
      rgba(145, 233, 255, 0.2)),
    repeating-linear-gradient(220deg,
      rgb(0, 0, 0) 0px,
      rgb(0, 0, 0) 19px,
      transparent 19px,
      transparent 22px),
    repeating-linear-gradient(189deg,
      rgb(0, 0, 0) 0px,
      rgb(0, 0, 0) 19px,
      transparent 19px,
      transparent 22px),
    repeating-linear-gradient(148deg,
      rgb(0, 0, 0) 0px,
      rgb(0, 0, 0) 19px,
      transparent 19px,
      transparent 22px),
    linear-gradient(90deg, rgb(7, 107, 42), rgb(240, 240, 240));
}

.gift-main-content .flowers {
  position: relative;
  transform: scale(0.9);
}

.flower {
  position: absolute;
  bottom: 10vmin;
  transform-origin: bottom center;
  z-index: 10;
  --fl-speed: 0.3s;
}

.flower--1 {
  -webkit-animation: moving-flower-1 4s linear infinite;
  animation: moving-flower-1 4s linear infinite;
}

.flower--1 .flower__line {
  height: 70vmin;
  -webkit-animation-delay: 0.3s;
  animation-delay: 0.3s;
}

.flower--1 .flower__line__leaf--1 {
  -webkit-animation: blooming-leaf-right var(--fl-speed) 1.6s backwards;
  animation: blooming-leaf-right var(--fl-speed) 1.6s backwards;
}

.flower--1 .flower__line__leaf--2 {
  -webkit-animation: blooming-leaf-right var(--fl-speed) 1.4s backwards;
  animation: blooming-leaf-right var(--fl-speed) 1.4s backwards;
}

.flower--1 .flower__line__leaf--3 {
  -webkit-animation: blooming-leaf-left var(--fl-speed) 1.2s backwards;
  animation: blooming-leaf-left var(--fl-speed) 1.2s backwards;
}

.flower--1 .flower__line__leaf--4 {
  -webkit-animation: blooming-leaf-left var(--fl-speed) 1s backwards;
  animation: blooming-leaf-left var(--fl-speed) 1s backwards;
}

.flower--1 .flower__line__leaf--5 {
  -webkit-animation: blooming-leaf-right var(--fl-speed) 1.8s backwards;
  animation: blooming-leaf-right var(--fl-speed) 1.8s backwards;
}

.flower--1 .flower__line__leaf--6 {
  -webkit-animation: blooming-leaf-left var(--fl-speed) 2s backwards;
  animation: blooming-leaf-left var(--fl-speed) 2s backwards;
}

.flower--2 {
  left: 50%;
  transform: rotate(20deg);
  -webkit-animation: moving-flower-2 4s linear infinite;
  animation: moving-flower-2 4s linear infinite;
}

.flower--2 .flower__line {
  height: 60vmin;
  -webkit-animation-delay: 0.6s;
  animation-delay: 0.6s;
}

.flower--2 .flower__line__leaf--1 {
  -webkit-animation: blooming-leaf-right var(--fl-speed) 1.9s backwards;
  animation: blooming-leaf-right var(--fl-speed) 1.9s backwards;
}

.flower--2 .flower__line__leaf--2 {
  -webkit-animation: blooming-leaf-right var(--fl-speed) 1.7s backwards;
  animation: blooming-leaf-right var(--fl-speed) 1.7s backwards;
}

.flower--2 .flower__line__leaf--3 {
  -webkit-animation: blooming-leaf-left var(--fl-speed) 1.5s backwards;
  animation: blooming-leaf-left var(--fl-speed) 1.5s backwards;
}

.flower--2 .flower__line__leaf--4 {
  -webkit-animation: blooming-leaf-left var(--fl-speed) 1.3s backwards;
  animation: blooming-leaf-left var(--fl-speed) 1.3s backwards;
}

.flower--3 {
  left: 50%;
  transform: rotate(-15deg);
  -webkit-animation: moving-flower-3 4s linear infinite;
  animation: moving-flower-3 4s linear infinite;
}

.flower--3 .flower__line {
  -webkit-animation-delay: 0.9s;
  animation-delay: 0.9s;
}

.flower--3 .flower__line__leaf--1 {
  -webkit-animation: blooming-leaf-right var(--fl-speed) 2.5s backwards;
  animation: blooming-leaf-right var(--fl-speed) 2.5s backwards;
}

.flower--3 .flower__line__leaf--2 {
  -webkit-animation: blooming-leaf-right var(--fl-speed) 2.3s backwards;
  animation: blooming-leaf-right var(--fl-speed) 2.3s backwards;
}

.flower--3 .flower__line__leaf--3 {
  -webkit-animation: blooming-leaf-left var(--fl-speed) 2.1s backwards;
  animation: blooming-leaf-left var(--fl-speed) 2.1s backwards;
}

.flower--3 .flower__line__leaf--4 {
  -webkit-animation: blooming-leaf-left var(--fl-speed) 1.9s backwards;
  animation: blooming-leaf-left var(--fl-speed) 1.9s backwards;
}

.flower__leafs {
  position: relative;
  -webkit-animation: blooming-flower 2s backwards;
  animation: blooming-flower 2s backwards;
}

.flower__leafs--1 {
  -webkit-animation-delay: 1.1s;
  animation-delay: 1.1s;
}

.flower__leafs--2 {
  -webkit-animation-delay: 1.4s;
  animation-delay: 1.4s;
}

.flower__leafs--3 {
  -webkit-animation-delay: 1.7s;
  animation-delay: 1.7s;
}

.flower__leafs::after {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  transform: translate(-50%, -100%);
  width: 8vmin;
  height: 8vmin;
  background-color: #6bf0ff;
  filter: blur(10vmin);
}

.flower__leaf {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 8vmin;
  height: 11vmin;
  border-radius: 51% 49% 47% 53%/44% 45% 55% 69%;
  background-color: #f672b0;
  background-image: linear-gradient(to top, #ee5286, #ee5286);
  transform-origin: bottom center;
  opacity: 0.9;
  box-shadow: inset 0 0 2vmin rgba(255, 255, 255, 0.5);
}

.flower__leaf--1 {
  transform: translate(-10%, 1%) rotateY(40deg) rotateX(-50deg);
}

.flower__leaf--2 {
  transform: translate(-50%, -4%) rotateX(40deg);
}

.flower__leaf--3 {
  transform: translate(-90%, 0%) rotateY(45deg) rotateX(50deg);
}

.flower__leaf--4 {
  width: 8vmin;
  height: 8vmin;
  transform-origin: bottom left;
  border-radius: 4vmin 10vmin 4vmin 4vmin;
  transform: translate(0%, 18%) rotateX(70deg) rotate(-43deg);
  background-image: linear-gradient(to top, #ee5286, #ee5286);
  z-index: 1;
  opacity: 0.8;
}

.flower__white-circle {
  position: absolute;
  left: -3.5vmin;
  top: -3vmin;
  width: 9vmin;
  height: 4vmin;
  border-radius: 50%;
  background-color: #fff;
}

.flower__white-circle::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 45%;
  transform: translate(-50%, -50%);
  width: 60%;
  height: 60%;
  border-radius: inherit;
  background-image:
    repeating-linear-gradient(135deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px),
    repeating-linear-gradient(45deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px),
    repeating-linear-gradient(67.5deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px),
    repeating-linear-gradient(135deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px),
    repeating-linear-gradient(45deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px),
    repeating-linear-gradient(112.5deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px),
    repeating-linear-gradient(112.5deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px),
    repeating-linear-gradient(45deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px),
    repeating-linear-gradient(22.5deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px),
    repeating-linear-gradient(45deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px),
    repeating-linear-gradient(22.5deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px),
    repeating-linear-gradient(135deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px),
    repeating-linear-gradient(157.5deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px),
    repeating-linear-gradient(67.5deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px),
    repeating-linear-gradient(67.5deg,
      rgba(0, 0, 0, 0.03) 0px,
      rgba(0, 0, 0, 0.03) 1px,
      transparent 1px,
      transparent 12px),
    linear-gradient(90deg, rgb(127, 47, 21), rgb(255, 206, 0));
}

.flower__line {
  height: 55vmin;
  width: 1.5vmin;
  background-image:
    linear-gradient(to left,
      rgba(0, 0, 0, 0.2),
      transparent,
      rgba(255, 255, 255, 0.2)),
    linear-gradient(to top, transparent 10%, #583e08, #944415);
  box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
  -webkit-animation: grow-flower-tree 4s backwards;
  animation: grow-flower-tree 4s backwards;
}

.flower__line__leaf {
  --w: 7vmin;
  --h: calc(var(--w) + 2vmin);
  position: absolute;
  top: 20%;
  left: 90%;
  width: var(--w);
  height: var(--h);
  border-top-right-radius: var(--h);
  border-bottom-left-radius: var(--h);
  background-image: linear-gradient(to top, rgba(20, 117, 122, 0.4), #095721);
}

.flower__line__leaf--1 {
  transform: rotate(70deg) rotateY(30deg);
}

.flower__line__leaf--2 {
  top: 45%;
  transform: rotate(70deg) rotateY(30deg);
}

.flower__line__leaf--3,
.flower__line__leaf--4,
.flower__line__leaf--6 {
  border-top-right-radius: 0;
  border-bottom-left-radius: 0;
  border-top-left-radius: var(--h);
  border-bottom-right-radius: var(--h);
  left: -460%;
  top: 12%;
  transform: rotate(-70deg) rotateY(30deg);
}

.flower__line__leaf--4 {
  top: 40%;
}

.flower__line__leaf--5 {
  top: 0;
  transform-origin: left;
  transform: rotate(70deg) rotateY(30deg) scale(0.6);
}

.flower__line__leaf--6 {
  top: -2%;
  left: -450%;
  transform-origin: right;
  transform: rotate(-70deg) rotateY(30deg) scale(0.6);
}

.flower__light {
  position: absolute;
  bottom: 0vmin;
  width: 1vmin;
  height: 1vmin;
  background-color: rgb(255, 251, 0);
  border-radius: 50%;
  filter: blur(0.2vmin);
  -webkit-animation: light-ans 4s linear infinite backwards;
  animation: light-ans 4s linear infinite backwards;
}

.flower__light:nth-child(odd) {
  background-color: #f76baf;
}

.flower__light--1 {
  left: -2vmin;
  -webkit-animation-delay: 1s;
  animation-delay: 1s;
}

.flower__light--2 {
  left: 3vmin;
  -webkit-animation-delay: 0.5s;
  animation-delay: 0.5s;
}

.flower__light--3 {
  left: -6vmin;
  -webkit-animation-delay: 0.3s;
  animation-delay: 0.3s;
}

.flower__light--4 {
  left: 6vmin;
  -webkit-animation-delay: 0.9s;
  animation-delay: 0.9s;
}

.flower__light--5 {
  left: -1vmin;
  -webkit-animation-delay: 1.5s;
  animation-delay: 1.5s;
}

.flower__light--6 {
  left: -4vmin;
  -webkit-animation-delay: 3s;
  animation-delay: 3s;
}

.flower__light--7 {
  left: 3vmin;
  -webkit-animation-delay: 2s;
  animation-delay: 2s;
}

.flower__light--8 {
  left: -6vmin;
  -webkit-animation-delay: 3.5s;
  animation-delay: 3.5s;
}

.flower__grass {
  --c: #04661f;
  --line-w: 1.5vmin;
  position: absolute;
  bottom: 12vmin;
  left: -7vmin;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  z-index: 20;
  transform-origin: bottom center;
  transform: rotate(-48deg) rotateY(40deg);
}

.flower__grass--1 {
  -webkit-animation: moving-grass 2s linear infinite;
  animation: moving-grass 2s linear infinite;
}

.flower__grass--2 {
  left: 2vmin;
  bottom: 10vmin;
  transform: scale(0.5) rotate(75deg) rotateX(10deg) rotateY(-200deg);
  opacity: 0.8;
  z-index: 0;
  -webkit-animation: moving-grass--2 1.5s linear infinite;
  animation: moving-grass--2 1.5s linear infinite;
}

.flower__grass--top {
  width: 7vmin;
  height: 10vmin;
  border-top-right-radius: 100%;
  border-right: var(--line-w) solid var(--c);
  transform-origin: bottom center;
  transform: rotate(-2deg);
}

.flower__grass--bottom {
  margin-top: -2px;
  width: var(--line-w);
  height: 25vmin;
  background-image: linear-gradient(to top, transparent, var(--c));
}

.flower__grass__leaf {
  --size: 10vmin;
  position: absolute;
  width: calc(var(--size) * 2.1);
  height: var(--size);
  border-top-left-radius: var(--size);
  border-top-right-radius: var(--size);
  background-image: linear-gradient(to top,
      transparent,
      transparent 30%,
      var(--c));
  z-index: 100;
}

.flower__grass__leaf--1 {
  top: -6%;
  left: 30%;
  --size: 6vmin;
  transform: rotate(-20deg);
  -webkit-animation: growing-grass-ans--1 2s 2.6s backwards;
  animation: growing-grass-ans--1 2s 2.6s backwards;
}

@-webkit-keyframes growing-grass-ans--1 {
  0% {
    transform-origin: bottom left;
    transform: rotate(-20deg) scale(0);
  }
}

@keyframes growing-grass-ans--1 {
  0% {
    transform-origin: bottom left;
    transform: rotate(-20deg) scale(0);
  }
}

.flower__grass__leaf--2 {
  top: -5%;
  left: -110%;
  --size: 6vmin;
  transform: rotate(10deg);
  -webkit-animation: growing-grass-ans--2 2s 2.4s linear backwards;
  animation: growing-grass-ans--2 2s 2.4s linear backwards;
}

@-webkit-keyframes growing-grass-ans--2 {
  0% {
    transform-origin: bottom right;
    transform: rotate(10deg) scale(0);
  }
}

@keyframes growing-grass-ans--2 {
  0% {
    transform-origin: bottom right;
    transform: rotate(10deg) scale(0);
  }
}

.flower__grass__leaf--3 {
  top: 5%;
  left: 60%;
  --size: 8vmin;
  transform: rotate(-18deg) rotateX(-20deg);
  -webkit-animation: growing-grass-ans--3 2s 2.2s linear backwards;
  animation: growing-grass-ans--3 2s 2.2s linear backwards;
}

@-webkit-keyframes growing-grass-ans--3 {
  0% {
    transform-origin: bottom left;
    transform: rotate(-18deg) rotateX(-20deg) scale(0);
  }
}

@keyframes growing-grass-ans--3 {
  0% {
    transform-origin: bottom left;
    transform: rotate(-18deg) rotateX(-20deg) scale(0);
  }
}

.flower__grass__leaf--4 {
  top: 6%;
  left: -135%;

  <script>
const heartsContainer = document.body;
const imageFiles = Array.from(
  { length: 12 },
  (_, i) => `img/Anh (${i + 1}).jpg`,
);

let letterText = [];

async function loadLetter() {
  const letterBody = document.getElementById("letter-body");
  const text = `Gửi người con gái anh yêu,\n\nNhân ngày Quốc tế Phụ nữ 8/3, anh muốn gửi đến em những lời chúc ngọt ngào nhất. Chúc em luôn xinh đẹp, rạng rỡ như những đóa hoa và luôn tràn ngập hạnh phúc bên anh.\n\nCảm ơn em đã luôn đồng hành và mang lại hơi ấm cho trái tim anh. Anh yêu em rất nhiều!\n\nChúc em một ngày 8/3 thật ý nghĩa và tràn đầy niềm vui. Mong rằng mỗi ngày trôi qua, nụ cười luôn nở trên môi em.\n\nMãi yêu em ❤️`;
  letterBody.innerHTML = "";
  let i = 0;
  function typeWriter() {
    if (i < text.length) {
      if (text.charAt(i) === "\n") {
        letterBody.innerHTML += "<br>";
      } else {
        letterBody.innerHTML += text.charAt(i);
      }
      i++;
      setTimeout(typeWriter, 50);
    }
  }
  typeWriter();
}

async function loadMessages() {
  window.messages = ["Mãi yêu em ❤️", "Chúc em 8/3 vui vẻ!", "Luôn xinh đẹp nhé!"];
}

loadMessages();

const giftMainContentEl = document.getElementById("giftMainContent");

function startExperience() {
        if (giftMainContentEl && giftMainContentEl.classList.contains('hidden')) {
                giftMainContentEl.classList.remove("hidden");
        }
        document.body.classList.remove("container");
        setTimeout(() => {
                createFallingImage();
                giftInterval = setInterval(createFallingImage, 1000);
                createFallingMessage();
                messageInterval = setInterval(createFallingMessage, 1500);
        }, 5000);
}

window.addEventListener("load", startExperience);

function createFallingImage() {
        if (typeof isGifting === "undefined" || !isGifting) return;

        const img = document.createElement("img");
        const randomNum = Math.floor(Math.random() * 12) + 1;
        img.src = `img/Anh (${randomNum}).jpg`;
        img.className = "falling-image";

        const width = window.innerWidth;
        const size = width < 600 ? Math.random() * 40 + 50 : Math.random() * 60 + 60;
        const startX = Math.random() * (width - size);
        const duration = Math.random() * 4 + 4;

        img.style.left = startX + "px";
        img.style.width = size + "px";
        img.style.height = "auto";
        img.style.animationDuration = duration + "s";

        document.body.appendChild(img);

        setTimeout(() => {
                img.remove();
        }, duration * 1000);
}

function createFallingMessage() {
        if (typeof isMessaging === "undefined" || !isMessaging) return;

        const msgDiv = document.createElement("div");
        msgDiv.className = "falling-message";
        msgDiv.innerText = messages[Math.floor(Math.random() * messages.length)];

        const colors = [
                { text: "#ff69b4", border: "#ffb6c1" },
                { text: "#9370db", border: "#e6e6fa" },
                { text: "#40e0d0", border: "#afeeee" },
                { text: "#ff8c00", border: "#ffe4b5" },
                { text: "#20b2aa", border: "#e0ffff" },
                { text: "#ff1493", border: "#ffc0cb" }
        ];
        const randomColor = colors[Math.floor(Math.random() * colors.length)];

        const width = window.innerWidth;
        const padding = 20;
        const startX = Math.random() * (width - 180 - padding * 2) + padding;
        const duration = Math.random() * 5 + 5;
        const fontSize = width < 600 ? Math.random() * 4 + 14 : Math.random() * 6 + 16;

        msgDiv.style.left = Math.max(padding, startX) + "px";
        msgDiv.style.fontSize = fontSize + "px";
        msgDiv.style.color = randomColor.text;
        msgDiv.style.borderColor = randomColor.border;
        msgDiv.style.animationDuration = duration + "s";

        document.body.appendChild(msgDiv);

        setTimeout(() => {
                msgDiv.remove();
        }, duration * 1000);
}

// Explosion Effect
document.addEventListener("click", (e) => {
        createHearts(e.clientX, e.clientY);
});

document.addEventListener("touchstart", (e) => {
        createHearts(e.touches[0].clientX, e.touches[0].clientY);
});

function createHearts(x, y) {
        const numHearts = 15;
        const icons = ["💖", "💝", "💗", "💓", "💞"]; // Fallback icons

        for (let i = 0; i < numHearts; i++) {
                const heart = document.createElement("div");
                heart.innerHTML = icons[Math.floor(Math.random() * icons.length)] || "💗";
                heart.className = "heart";

                const angle = Math.random() * Math.PI * 2;
                const distance = 50 + Math.random() * 150;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                heart.style.setProperty("--x", dx);
                heart.style.setProperty("--y", dy);
                heart.style.left = x + "px";
                heart.style.top = y + "px";
                heart.style.fontSize = Math.random() * 20 + 10 + "px";
                heart.style.setProperty("--r", Math.random() * 360 - 180 + "deg");

                document.body.appendChild(heart);

                setTimeout(() => {
                        heart.remove();
                }, 1000);
        }
}

// Global Click Pop Sound
var giftPopSoundEl = document.getElementById("pop-sound");
window.addEventListener("mousedown", () => {
        if (giftPopSoundEl) {
                const sound = giftPopSoundEl.cloneNode(true);
                sound.play();
        }
}, true);
